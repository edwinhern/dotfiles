name: Update APM Locks

on:
  schedule:
    - cron: "0 0 * * 5" # Every Friday at midnight UTC, matching CI schedule
  workflow_dispatch: # Allow manual trigger from the Actions tab

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh_locks:
    name: Refresh APM lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Refresh APM lockfiles
        run: mise exec -- bash scripts/refresh-apm-locks.sh
      # Gate the refreshed lockfiles here: a PR opened with the default
      # GITHUB_TOKEN does not trigger the on: pull_request CI run, so the
      # frozen-install check must pass before the PR is opened.
      - name: Validate refreshed lockfiles
        run: mise exec -- bash scripts/validate-apm.sh all
      - name: Open PR if lockfiles changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: refresh APM lockfiles"
          branch: chore/apm-lock-refresh
          delete-branch: true
          title: "Refresh APM lockfiles"
          body: |
            Automated refresh of committed APM lockfiles.

            Re-resolves each channel ref to its latest SHA and rewrites
            `home/.chezmoitemplates/apm/apm.lock.*.yaml`.

            The frozen-install gate ran on these lockfiles before this PR was
            opened, since an auto-PR does not trigger the on: pull_request CI run.

            Refs DOT-31
          labels: dependencies
