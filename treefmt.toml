# treefmt: one formatter per file type. Walks the tree, respects .gitignore,
# and dispatches to each tool. Owns all file selection so no per-tool ignore
# files (.prettierignore, taplo.toml) are needed at the repo root.
#
# Chezmoi templates (*.tmpl) hold Go template syntax that these formatters
# cannot parse. Vendored bats libraries under tests/test_helpers are third
# party and stay unformatted.

[formatter.shfmt]
command = "shfmt"
options = ["-w"]
includes = ["*.sh", "*.zsh", ".zshrc", ".bashrc"]
excludes = ["*.tmpl"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.md", "*.yaml", "*.yml", "*.json"]
excludes = ["*.tmpl", "tests/test_helpers/**"]

[formatter.taplo]
command = "taplo"
options = ["fmt"]
includes = ["*.toml"]
excludes = ["*.tmpl", "tests/test_helpers/**"]
