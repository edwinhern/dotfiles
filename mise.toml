[tools]
actionlint = "1.7.12"
bats = "1.13.0"
chezmoi = "2.70.3"
prettier = "3.8.3"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
"aqua:numtide/treefmt" = "2.5.0"

[tasks.diff]
description = "Preview chezmoi changes from this source tree"
run = 'chezmoi diff --source="$PWD"'

[tasks.update]
description = "Apply this source tree with chezmoi"
run = 'chezmoi apply --verbose --source="$PWD"'

[tasks.reset]
description = "Clear chezmoi script state"
run = "chezmoi state delete-bucket --bucket=scriptState"

[tasks.apply-dry-run]
description = "Preview a full chezmoi apply from this source tree without writing"
run = 'chezmoi apply --source="$PWD" -n -v'

[tasks.format]
description = "Format all files with treefmt"
run = "treefmt"

[tasks.lint]
description = "Check formatting, lint shell, and lint GitHub Actions workflows"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# treefmt walks the tree and checks formatting; shellcheck adds static analysis.
# git ls-files scopes both shellcheck passes to tracked files, so vendored or
# ignored scripts stay out without hand-maintained root lists.
treefmt --ci

git ls-files '*.sh' '*.zsh' '*.zshrc' | xargs shellcheck

# bats files use a test DSL that shfmt would reflow, so shellcheck alone lints them.
# Severity stays at warning because bats idioms (literal-string assertions, per-test
# subshells) trip info-level checks that are not real bugs.
git ls-files '*.bats' | xargs shellcheck --severity=warning

# actionlint checks workflow semantics that treefmt cannot: expression syntax,
# runner labels, job needs, and shellcheck over embedded run: scripts. It finds
# .github/workflows on its own and picks up the shellcheck installed above.
actionlint
'''

[tasks.test]
description = "Run all bats tests"
run = "bats --recursive tests"

[tasks.coverage]
description = "Run the bats suite under kcov and write a coverage report to coverage/"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# kcov drives the bats run under ptrace and records which lines of the sourced
# shell libraries actually execute. It is not part of the mise toolchain because
# it ships as a native package, so guard on it and point at an install hint.
if ! command -v kcov >/dev/null 2>&1; then
  echo "error: kcov not found." >&2
  echo "  macOS:  brew install kcov" >&2
  echo "  Ubuntu: sudo apt-get install -y kcov" >&2
  exit 1
fi

out="${COVERAGE_DIR:-coverage}"
rm -rf "$out"
mkdir -p "$out"

# Restrict accounting to first-party shell sources. Vendored bats helpers under
# tests/test_helpers and the .bats files themselves stay out of the denominator.
include="home/.chezmoitemplates/lib,home/dot_claude/statusline-command.sh,.github/actions/write-chezmoi-config/write-chezmoi-config.sh"

kcov --clean --include-path="$include" "$out" bats --recursive tests

echo "Coverage report written to $out/index.html"
'''

[tasks.check]
description = "Run lint and tests"
run = [{ task = "lint" }, { task = "test" }]
