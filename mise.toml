[tools]
bats = "1.13.0"
chezmoi = "2.70.3"
prettier = "3.8.3"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
"aqua:numtide/treefmt" = "2.5.0"

[tasks.diff]
description = "Preview chezmoi changes from this source tree"
run = 'chezmoi diff --source="$PWD"'

[tasks.update]
description = "Apply this source tree with chezmoi"
run = 'chezmoi apply --verbose --source="$PWD"'

[tasks.reset]
description = "Clear chezmoi script state"
run = "chezmoi state delete-bucket --bucket=scriptState"

[tasks.reset-config]
description = "Re-run chezmoi init data prompts for this source tree"
run = 'chezmoi init --data=false --source="$PWD"'

[tasks.format]
description = "Format all files with treefmt"
run = "treefmt"

[tasks.lint]
description = "Check formatting with treefmt and lint shell with shellcheck"
run = '''
#!/usr/bin/env bash
set -euo pipefail

treefmt --ci

shell_roots=()
has_shell_roots=0
for root in scripts home/dot_config/zsh home/.chezmoitemplates home/dot_claude .github/actions; do
  if [[ -d "${root}" ]]; then
    shell_roots+=("${root}")
    has_shell_roots=1
  fi
done

if ((has_shell_roots)); then
  shell_targets=()
  while IFS= read -r shell_target; do
    shell_targets+=("${shell_target}")
  done < <(find "${shell_roots[@]}" -type f \( -name '*.sh' -o -name '*.zsh' -o -name '.zshrc' \))

  if [[ -n "${shell_targets[*]:-}" ]]; then
    shellcheck "${shell_targets[@]}"
  fi
fi

# bats files use a test DSL that shfmt would reflow, so lint them with shellcheck only.
# Severity stays at warning because bats idioms (literal-string assertions, per-test
# subshells) trip info-level checks that are not real bugs.
if [[ -d tests ]]; then
  bats_targets=()
  while IFS= read -r bats_target; do
    bats_targets+=("${bats_target}")
  done < <(find tests -type f -name '*.bats')

  if [[ -n "${bats_targets[*]:-}" ]]; then
    shellcheck --shell=bash --severity=warning "${bats_targets[@]}"
  fi
fi
'''

[tasks.test-unit]
description = "Run bats unit tests"
run = "bats --recursive tests/unit"

[tasks.test-template]
description = "Run bats template tests"
run = "bats --recursive tests/template"

[tasks.test]
description = "Run all bats tests"
run = [{ task = "test-unit" }, { task = "test-template" }]

[tasks.check]
description = "Run lint and tests"
run = [{ task = "lint" }, { task = "test" }]
