apm:
  targets:
    shared: []
    personal:
      - opencode
    work:
      - copilot
  dependencies:
    shared:
      - obra/superpowers
      - JuliusBrussee/caveman
      - anthropics/claude-plugins-official/plugins/skill-creator

    personal:
      - schpet/linear-cli

    work: []

  mcp:
    shared:
      - name: grep
        registry: false
        transport: http
        url: https://mcp.grep.app

    personal: []

    work:
      - name: figma
        registry: false
        transport: http
        url: https://mcp.figma.com/mcp
        headers:
          Authorization: "Bearer ${FIGMA_TOKEN}"

      - name: atlassian-jira
        registry: false
        transport: stdio
        command: npx
        args:
          - "-y"
          - "mcp-remote"
          - "https://mcp.atlassian.com/v1/mcp"
          - "--resource"
          - "${ATLASSIAN_JIRA_RESOURCE_URL}"

      - name: atlassian-knowledge
        registry: false
        transport: stdio
        command: npx
        args:
          - "-y"
          - "mcp-remote"
          - "https://mcp.atlassian.com/v1/mcp"
          - "--resource"
          - "${ATLASSIAN_KNOWLEDGE_RESOURCE_URL}"
