apm:
  targets:
    shared: []
    personal:
      - claude
      - agent-skills
    work:
      - copilot
  dependencies:
    shared:
      - obra/superpowers
      - JuliusBrussee/caveman
      - anthropics/claude-plugins-official/plugins/skill-creator

    personal:
      - schpet/linear-cli
      - tavily-ai/skills

    work: []

  mcp:
    shared:
      - name: grep
        registry: false
        transport: http
        url: https://mcp.grep.app

    personal:
      - name: tavily
        registry: false
        transport: http
        url: https://mcp.tavily.com/mcp/

    work:
      - name: figma
        registry: false
        transport: http
        url: https://mcp.figma.com/mcp

      - name: atlassian-jira
        registry: false
        transport: stdio
        command: npx
        args:
          - "-y"
          - "mcp-remote"
          - "https://mcp.atlassian.com/v1/mcp"
          - "--resource"
          - "${ATLASSIAN_JIRA_RESOURCE_URL}"
