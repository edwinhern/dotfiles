".config/zsh/plugins/zsh-autosuggestions":
  type: git-repo
  url: https://github.com/zsh-users/zsh-autosuggestions.git
  refreshPeriod: 168h

".config/zsh/plugins/zsh-history-substring-search":
  type: git-repo
  url: https://github.com/zsh-users/zsh-history-substring-search.git
  refreshPeriod: 168h

".config/zsh/plugins/zsh-syntax-highlighting":
  type: git-repo
  url: https://github.com/zsh-users/zsh-syntax-highlighting.git
  refreshPeriod: 168h

".config/zsh/plugins/zsh-transient-prompt":
  type: git-repo
  url: https://github.com/olets/zsh-transient-prompt.git
  refreshPeriod: 168h

".vscode/extensions/arishawke.fadetouched-1.0.0":
  type: archive
  url: https://github.com/Arishawke/fadetouched-theme/archive/refs/heads/main.tar.gz
  exact: true
  stripComponents: 3
  refreshPeriod: 168h
  include:
    - "*/ports/vscode/**"
